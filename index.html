<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador OC - Hard Hat Solutions</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f7fa;
            padding: 20px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            min-height: 100vh;
        }
        .control-panel {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 420px;
            max-width: 100%;
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        .page {
            background: white;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.12);
            flex: 1;
            min-width: 650px;
            max-width: 950px;
            border: 1px solid #e2e8f0;
        }
        @media (max-width: 1200px) {
            body { flex-direction: column; align-items: center; }
            .control-panel, .page { width: 100%; max-width: 800px; min-width: auto; }
            .control-panel { position: static; }
        }
        h2 { color: #0066cc; margin-bottom: 20px; font-size: 24px; }
        h3 { color: #0066cc; margin: 25px 0 15px; font-size: 18px; }
        select, input[type=text], input[type=date], input[type=number] {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }
        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background: #0055aa; }
        .btn-print {
            width: 100%;
            padding: 20px;
            font-size: 22px;
            margin-top: 40px;
        }
        .info-grid {
            display: flex;
            gap: 25px;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        .info-block {
            flex: 1;
            min-width: 300px;
            background: #f8fbff;
            padding: 22px;
            border-radius: 12px;
            border-left: 4px solid #0066cc;
            font-size: 16px;
            line-height: 1.8;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 35px 0;
            font-size: 15px;
        }
        th {
            background: #0066cc;
            color: white;
            padding: 16px;
            text-align: left;
        }
        td { padding: 14px; border-bottom: 1px solid #eee; }
        .totals-box {
            display: inline-block;
            background: #f0f7ff;
            padding: 30px;
            border-radius: 14px;
            border: 2px solid #0066cc;
            min-width: 360px;
        }
        .oc-number span { font-size: 40px; color: #0066cc; font-weight: bold; }

        @media print {
            .no-print { display: none !important; }
            body, .page { background: white !important; margin: 0 !important; padding: 40px !important; box-shadow: none !important; }
        }
    </style>
</head>
<body>

<div class="control-panel no-print">
    <h2>Datos de la OC</h2>
    <select id="inputObraSelect"><option value="">Selecciona la obra</option></select>
    <select id="inputProveedor"><option value="" disabled selected>Selecciona Razón Social</option></select>
    <input type="text" id="inputRutProv" placeholder="RUT Proveedor" readonly>
    <input type="text" id="inputDireccion" placeholder="Dirección" readonly>
    <input type="date" id="inputFecha" readonly>
    <select id="inputCondicionPago"><option value="">Seleccione proveedor primero</option></select>

    <h3>Notas al Proveedor</h3>
    <div style="display:flex; gap:10px;">
        <input type="text" id="nuevaNota" placeholder="Escriba nota y presione Enter" style="flex:1;">
        <button onclick="agregarNota()">+ Agregar</button>
    </div>
    <div id="listaNotasEditables" style="margin-top:15px; max-height:200px; overflow-y:auto; background:#f9f9f9; padding:15px; border-radius:12px;"></div>

    <h3>Ítems</h3>
    <select id="newClase"><option value="" disabled selected>Clase</option></select>
    <input type="text" id="newDesc" placeholder="Descripción">
    <div style="display:flex; gap:10px; margin-top:10px;">
        <input type="number" id="newQty" placeholder="Cant." style="width:120px;">
        <input type="number" id="newPrice" placeholder="Precio Unit." style="flex:1;">
        <button onclick="agregarItem()">+ Agregar</button>
    </div>

    <div style="text-align:center; margin-top:50px;">
        <button class="btn-print" onclick="generarPDF()">Generar y Descargar PDF</button>
        <p style="margin-top:20px; font-size:18px; color:#555;">
            Próxima OC: <strong id="proximaOC" style="color:#0066cc; font-size:24px;">0002</strong>
        </p>
    </div>
</div>

<div class="page">
    <header style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:40px
