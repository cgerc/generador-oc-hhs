<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HHS | Generador OC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body{font-family:Arial,sans-serif;margin:0;background:#f0f2f5;padding:20px;}
        .card{max-width:1100px;margin:20px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.1);}
        input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:6px;border:1px solid #ddd;}
        button{background:#0066cc;color:white;border:none;cursor:pointer;font-size:16px;padding:15px;}
        button:hover{background:#0055aa;}
        .logout{position:fixed;top:10px;right:10px;background:#dc3545;padding:10px 20px;border-radius:6px;}
        .historial{margin-top:30px;padding:20px;background:#f9f9f9;border-radius:8px;max-height:500px;overflow-y:auto;}
        .oc-item{margin:15px 0;padding:15px;background:white;border-radius:8px;border-left:5px solid #0066cc;cursor:pointer;}
        .hidden{display:none;}
        #preview{background:white;padding:40px;border:1px solid #ddd;min-height:900px;font-size:14px;}
        table{width:100%;border-collapse:collapse;margin:20px 0;}
        th{background:#0066cc;color:white;padding:10px;}
        td{padding:8px;border-bottom:1px solid #ddd;}
    </style>
</head>
<body>

<div id="login" class="card">
    <h1>HARD HAT SOLUTIONS</h1>
    <h3>Generador de Órdenes de Compra</h3>
    <input type="email" id="email" placeholder="Correo" value="admin@hhs.cl">
    <input type="password" id="pass" placeholder="Contraseña" value="123456">
    <button onclick="login()">INGRESAR</button>

</div>

<div id="app" class="card hidden">
    <button class="logout" onclick="logout()">Cerrar Sesión</button>
    <h2>Generador de OC | Próxima: <strong id="proximaOC">0001</strong></h2>
    
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:30px;">
        <div>
            <select id="obra"><option value="">Selecciona obra</option></select>
            <select id="proveedor"><option value="" disabled selected>Proveedor</option></select>
            <input type="text" id="rut" readonly placeholder="RUT">
            <input type="text" id="direccion" readonly placeholder="Dirección">
            <input type="date" id="fecha" readonly>
            <hr>
            <select id="clase"><option value="" disabled selected>Clase</option></select>
            <input type="text" id="desc" placeholder="Descripción">
            <div style="display:flex;gap:10px;">
                <input type="number" id="cant" placeholder="Cant." style="width:40%;">
                <input type="number" id="precio" placeholder="Precio" style="width:60%;">
            </div>
            <button onclick="addItem()">+ Agregar Ítem</button>
            <button onclick="addNota()" style="background:#28a745;">+ Nota al proveedor</button>
            <button onclick="generar()" style="background:#e74c3c;font-size:18px;">GENERAR Y GUARDAR PDF</button>
        </div>
        <div id="preview">Selecciona datos para ver vista previa...</div>
    </div>

    <div class="historial">
        <h3>Historial de Órdenes de Compra</h3>
        <input type="text" placeholder="Buscar por obra, proveedor o número..." onkeyup="buscar(this.value)">
        <div id="historial">Cargando historial...</div>
    </div>
</div>

<script>
// TU CONFIGURACIÓN REAL (copiada de Firebase)
const firebaseConfig = {
  apiKey: "AIzaSyCwDRA3mjg-91-n4E15B9TVxwSQHLe4avE",
  authDomain: "generador-oc.firebaseapp.com",
  projectId: "generador-oc",
  storageBucket: "generador-oc.appspot.com",
  messagingSenderId: "4670193750",
  appId: "1:4670193750:web:ffba327eb5dbc1821ffbf7",
  measurementId: "G-FJHG9GDK7Y"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let items = [], notas = [], numero = 1;

function login() {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('pass').value;
    auth.signInWithEmailAndPassword(email, pass)
        .then(() => location.reload())
        .catch(() => alert("Correo o contraseña incorrectos"));
}
function logout() { auth.signOut().then(() => location.reload()); }

auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        iniciarApp();
    }
});

async function iniciarApp() {
    document.getElementById('fecha').valueAsDate = new Date();
    const config = await db.collection('config').doc('oc').get();
    numero = config.exists ? config.data().siguiente : 1;
    document.getElementById('proximaOC').textContent = String(numero + 1).padStart(4, '0');

    cargarProveedores();
    cargarObras();
    cargarHistorial();
}

function cargarProveedores() {
    fetch('https://docs.google.com/spreadsheets/d/1vSQ0W7Yhu123yENGAHaV5Ok-yX5DkPO_7orj9rydaVbI_f4DDQN41MPc7nuGSIkaO_-vBeRnM2rF9SR/export?format=csv')
    .then(r => r.text()).then(csv => {
        const filas = csv.split('\n');
        const data = {};
        for (let i = 1; i < filas.length && i <= 40; i++) {
            const c = filas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(x => x.replace(/^"|"$/g, '').trim());
            if (c[0] && c[1]) data[c[0]] = {razon: c[1], rut: c[3]||'', dir: c[4]||''};
        }
        const p = document.getElementById('proveedor');
        const cl = document.getElementById('clase');
        Object.keys(data).sort((a,b) => data[a].razon.localeCompare(data[b].razon)).forEach(k => {
            p.add(new Option(data[k].razon, k));
            cl.add(new Option(k, k));
        });
        p.onchange = () => {
            const d = data[p.value];
            document.getElementById('rut').value = d.rut;
            document.getElementById('direccion').value = d.dir;
        };
    });
}

function cargarObras() {
    fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vSQ0W7Yhu123yENGAHaV5Ok-yX5DkPO_7orj9rydaVbI_f4DDQN41MPc7nuGSIkaO_-vBeRnM2rF9SR/pub?gid=1397970288&single=true&output=csv')
    .then(r => r.text()).then(csv => {
        const sel = document.getElementById('obra');
        csv.split('\n').slice(1).forEach(l => {
            const n = l.split(',')[0].replace(/^"|"$/g,'').trim();
            if (n && n!=="Obras") sel.add(new Option(n,n));
        });
    });
}

function addItem() {
    const clase = document.getElementById('clase').value;
    const desc = document.getElementById('desc').value.trim();
    const cant = parseFloat(document.getElementById('cant').value) || 0;
    const precio = parseFloat(document.getElementById('precio').value) || 0;
    if (!clase || !desc || cant <= 0 || precio <= 0) return alert("Completa todos los campos del ítem");
    items.push({clase, desc, cant, precio, total: cant*precio});
    document.getElementById('desc').value = '';
    document.getElementById('cant').value = '';
    document.getElementById('precio').value = '';
    render();
}

function addNota() {
    const txt = prompt("Nota al proveedor:");
    if (txt) { notas.push(txt); render(); }
}

function render() {
    const neto = items.reduce((s,i) => s + i.total, 0);
    const iva = neto * 0.19;
    const total = neto + iva;
    document.getElementById('preview').innerHTML = `
        <div style="text-align:center;"><h1>ORDEN DE COMPRA N° ${String(numero).padStart(4,'0')}</h1></div>
        <p><strong>Fecha:</strong> ${new Date().toLocaleDateString('es-CL')}</p>
        <p><strong>Obra:</strong> ${document.getElementById('obra').value || '–'}</p>
        <p><strong>Proveedor:</strong> ${document.getElementById('proveedor').selectedOptions[0]?.text || '–'}</p>
        <p><strong>RUT:</strong> ${document.getElementById('rut').value || '–'}</p>
        <p><strong>Dirección:</strong> ${document.getElementById('direccion').value || '–'}</p>
        <table>
            <thead><tr><th>Clase</th><th>Descripción</th><th>Cant.</th><th>Precio Unit.</th><th>Total</th></tr></thead>
            <tbody>
                ${items.map(i => `<tr><td>${i.clase}</td><td>${i.desc}</td><td>${i.cant}</td><td>${new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP'}).format(i.precio)}</td><td>${new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP'}).format(i.total)}</td></tr>`).join('')}
            </tbody>
        </table>
        <div style="text-align:right;margin-top:30px;">
            <h3>Neto: ${new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP'}).format(neto)}</h3>
            <h3>IVA 19%: ${new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP'}).format(iva)}</h3>
            <h2>TOTAL: ${new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP'}).format(total)}</h2>
        </div>
        ${notas.length ? '<p><strong>Notas:</strong><br>' + notas.map(n => '• ' + n).join('<br>') + '</p>' : ''}
        <div style="margin-top:60px;text-align:right;">
            <hr style="width:300px;margin-left:auto;">
            <p><strong>Jorge Chacon</strong><br>Gerente General</p>
        </div>
    `;
}

async function generar() {
    render();
    const opt = {margin: 0.4, filename: `OC_${String(numero).padStart(4,'0')}.pdf`, html2canvas: {scale: 2}, jsPDF: {format: 'letter', orientation: 'portrait'}};
    html2pdf().set(opt).from(document.getElementById('preview')).save().then(async () => {
        await db.collection('ocs').add({
            numero, fecha: new Date(), obra: document.getElementById('obra').value || '',
            proveedor: document.getElementById('proveedor').selectedOptions[0]?.text || '',
            total: new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP'}).format(items.reduce((s,i)=>s+i.total,0)*1.19),
            items, notas, usuario: auth.currentUser.email
        });
        await db.collection('config').doc('oc').set({siguiente: numero + 1});
        numero++;
        document.getElementById('proximaOC').textContent = String(numero + 1).padStart(4, '0');
        items = []; notas = []; render();
        cargarHistorial();
        alert("¡OC generada y guardada con éxito!");
    });
}

async function cargarHistorial() {
    const snap = await db.collection('ocs').orderBy('fecha', 'desc').get();
    const div = document.getElementById('historial');
    if (snap.empty) {
        div.innerHTML = "<p>No hay OCs emitidas aún.</p>";
        return;
    }
    div.innerHTML = snap.docs.map(doc => {
        const d = doc.data();
        return `<div class="oc-item">
            <strong>OC ${String(d.numero).padStart(4,'0')}</strong> | ${new Date(d.fecha.seconds*1000).toLocaleDateString('es-CL')}
            | ${d.obra} | ${d.proveedor} | <strong>${d.total}</strong>
        </div>`;
    }).join('');
}

function buscar(txt) {
    document.querySelectorAll('.oc-item').forEach(el => {
        el.style.display = el.textContent.toLowerCase().includes(txt.toLowerCase()) ? 'block' : 'none';
    });
}
</script>
</body>
</html>
