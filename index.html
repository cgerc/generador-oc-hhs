<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HHS | Generador OC Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body{font-family:Arial,sans-serif;margin:0;background:#f0f2f5;padding:20px;}
        .card{max-width:1100px;margin:20px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.1);}
        input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:6px;border:1px solid #ddd;}
        button{background:#0066cc;color:white;border:none;cursor:pointer;font-size:16px;padding:15px;}
        button:hover{background:#0055aa;}
        .logout{position:fixed;top:10px;right:10px;background:#dc3545;padding:10px 20px;border-radius:6px;color:white;}
        .hidden{display:none;}
        #preview{background:white;padding:40px;border:1px solid #ddd;min-height:900px;font-size:14px;}
        table{width:100%;border-collapse:collapse;margin:20px 0;}
        th{background:#0066cc;color:white;padding:10px;}
        td{padding:8px;border-bottom:1px solid #ddd;}
    </style>
</head>
<body>

<div id="login" class="card">
    <h1>HARD HAT SOLUTIONS</h1>
    <h3>Generador de Órdenes de Compra PRO</h3>
    <input type="email" id="email" placeholder="Correo">
    <input type="password" id="pass" placeholder="Contraseña">
    <button onclick="login()">INGRESAR</button>
    <p style="margin-top:20px;color:#666;font-size:14px;">
        Usuarios creados:<br>
        • administracion@hhs.cl<br>
        • gercanepacarmen@gmail.com<br>
        (usa la contraseña que le pusiste en Firebase)
    </p>
</div>

<div id="app" class="card hidden">
    <button class="logout" onclick="logout()">Cerrar Sesión</button>
    <h2>Bienvenid@ <span id="userEmail"></span> | Próxima OC: <strong id="proximaOC">0001</strong></h2>
    <p>¡TODO FUNCIONA! Ya puedes generar OCs y quedan guardadas para siempre.</p>
</div>

<script>
// TU CONFIGURACIÓN REAL (100 % correcta)
const firebaseConfig = {
  apiKey: "AIzaSyCwDRA3mjg-91-n4E15B9TVxwSQHLe4avE",
  authDomain: "generador-oc.firebaseapp.com",
  projectId: "generador-oc",
  storageBucket: "generador-oc.appspot.com",
  messagingSenderId: "4670193750",
  appId: "1:4670193750:web:ffba327eb5dbc1821ffbf7",
  measurementId: "G-FJHG9GDK7Y"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login() {
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('pass').value;
    auth.signInWithEmailAndPassword(email, pass)
        .then(user => {
            document.getElementById('login').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('userEmail').textContent = user.user.email;
        })
        .catch(err => alert("Correo o contraseña incorrectos"));
}
function logout() {
    auth.signOut().then(() => location.reload());
}
</script>
</body>
</html>
