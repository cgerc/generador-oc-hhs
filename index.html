<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HHS | Generador OC Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body{font-family:Arial,sans-serif;background:#f0f2f5;padding:20px;margin:0;}
        .card{max-width:1100px;margin:20px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.1);}
        input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:6px;border:1px solid #ddd;}
        button{background:#0066cc;color:white;border:none;cursor:pointer;font-size:16px;}
        button:hover{background:#0055aa;}
        .logout{position:fixed;top:10px;right:10px;background:#dc3545;padding:10px 20px;border-radius:6px;color:white;}
        .hidden{display:none;}
        #app h2{color:#0066cc;}
    </style>
</head>
<body>

<div id="login" class="card">
    <h1>HARD HAT SOLUTIONS</h1>
    <h3>Generador de Órdenes de Compra PRO</h3>
    <input type="email" id="email" placeholder="Correo" value="administracion@hhs.cl">
    <input type="password" id="pass" placeholder="Contraseña">
    <button onclick="login()">INGRESAR</button>
</div>

<div id="app" class="card hidden">
    <button class="logout" onclick="logout()">Cerrar Sesión</button>
    <h2>¡BIENVENID@ <span id="userEmail"></span>!</h2>
    <h3>Todo funcionando correctamente</h3>
    <p>Login OK ✓ | Firestore OK ✓ | Reglas corregidas ✓</p>
    <p>Ya puedes usar el generador completo sin problemas.</p>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCwDRA3mjg-91-n4E15B9TVxwSQHLe4avE",
  authDomain: "generador-oc.firebaseapp.com",
  projectId: "generador-oc",
  storageBucket: "generador-oc.appspot.com",
  messagingSenderId: "4670193750",
  appId: "1:4670193750:web:ffba327eb5dbc1821ffbf7",
  measurementId: "G-FJHG9GDK7Y"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login() {
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('pass').value;
    auth.signInWithEmailAndPassword(email, pass)
        .then(user => {
            document.getElementById('login').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('userEmail').textContent = user.user.email;
        })
        .catch(() => alert("Correo o contraseña incorrectos"));
}
function logout() { auth.signOut().then(() => location.reload()); }

auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('userEmail').textContent = user.email;
    }
});
</script>
</body>
</html>
